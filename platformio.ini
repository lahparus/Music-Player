[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Bluetooth makes the program bigger than the default partition allows,
; so use the "huge app" layout.
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/pschatzmann/ESP32-A2DP.git
    https://github.com/pschatzmann/arduino-libhelix.git

; TFT_eSPI is configured here instead of editing the library's User_Setup.h
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; control pins
    -DTFT_CS=33
    -DTFT_DC=21
    -DTFT_RST=32
    -DTFT_WR=4
    -DTFT_RD=-1
    ; 8 data pins (shield LCD_D0 .. LCD_D7)
    -DTFT_D0=22
    -DTFT_D1=13
    -DTFT_D2=26
    -DTFT_D3=25
    -DTFT_D4=17
    -DTFT_D5=16
    -DTFT_D6=27
    -DTFT_D7=14
    ; fonts to include
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1